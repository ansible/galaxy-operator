---
- name: Check application status
  block:
    - name: Wait for application status
      ansible.builtin.include_tasks: wait_for_status.yml
  rescue:
    - name: Determine whether content heartbeat recovery is applicable
      ansible.builtin.set_fact:
        content_recovery_required: >-
          {{
            status_check_result is defined and
            status_check_result.json is defined and
            (status_check_result.json.database_connection | default({})).connected | default(false) | bool and
            (status_check_result.json.online_content_apps | default([], true) | length) < (expected_content_apps | int)
          }}

    - name: Restart content Pods when content heartbeats are missing
      ansible.builtin.include_tasks: restart_content.yml
      when: content_recovery_required | bool

    - name: Recheck application status after content recovery
      ansible.builtin.include_tasks: wait_for_status.yml
      when: content_recovery_required | bool

    - name: Report failed application status check
      ansible.builtin.fail:
        msg: "Galaxy status check failed and content heartbeat recovery was not applicable."
      when: not content_recovery_required | bool
