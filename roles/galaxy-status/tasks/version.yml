---
- name: Set the status protocol and port
  ansible.builtin.set_fact:
    status_protocol: "https"
    status_port: "8443"
  when:
    - ingress_type | lower == 'route'
    - route_tls_termination_mechanism | lower == 'passthrough'

- name: Check through galaxy-web that the app is ready
  ansible.builtin.uri:
    url: >-
      {{ status_protocol }}://{{ ansible_operator_meta.name
      }}-web-svc.{{ ansible_operator_meta.namespace
      }}.svc.cluster.local:{{ status_port }}/{{ pulp_combined_settings.galaxy_api_path_prefix
      }}/status/
    status_code: [200, 500]
  register: result_not_route
  until: >
    result_not_route.json is defined and
    result_not_route.json.status == 'good' and
    result_not_route.json.issues == []
  delay: 5
  retries: 60
  when:
    - ingress_type | lower != 'route'

- name: Check through galaxy-route that the app is ready
  ansible.builtin.uri:
    url: 'https://{{ route_host }}/{{ pulp_combined_settings.galaxy_api_path_prefix }}/status/'
    status_code: [200, 500]
    validate_certs: false
  register: result_route
  until: >
    result_route.json is defined and
    result_route.json.status == 'good' and
    result_route.json.issues == []
  delay: 5
  retries: 60
  when:
    - ingress_type | lower == 'route'

- name: Find a ready API pod to read installed plugin versions
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: '{{ ansible_operator_meta.namespace }}'
    label_selectors:
      - 'app.kubernetes.io/name={{ deployment_type }}-api'
      - 'app.kubernetes.io/managed-by={{ deployment_type }}-operator'
      - 'app.kubernetes.io/instance={{ deployment_type }}-api-{{ ansible_operator_meta.name }}'
      - 'app.kubernetes.io/component=api'
    field_selectors:
      - status.phase=Running
  register: api_pods
  until: >-
    api_pods.resources | length > 0 and
    api_pods.resources[0].status.containerStatuses | default([])
    | selectattr('name', 'equalto', 'api')
    | selectattr('ready')
    | list
    | length > 0
  delay: 5
  retries: 60

- name: Read installed plugin versions from the API pod
  kubernetes.core.k8s_exec:
    namespace: '{{ ansible_operator_meta.namespace }}'
    pod: '{{ api_pods.resources[0].metadata.name }}'
    container: api
    command: >-
      bash -c "pulpcore-manager shell -c
      \"import json; from pulpcore.app.apps import pulp_plugin_configs;
      print(json.dumps(dict((app.label, app.version) for app in pulp_plugin_configs())))\""
  register: installed_plugin_versions
  changed_when: false

- name: Set installed plugins
  ansible.builtin.set_fact:
    installed_plugins: '{{ installed_plugin_versions.stdout | trim | from_json }}'

- name: Show installed plugins
  ansible.builtin.debug:
    var: installed_plugins

- name: Update version status
  operator_sdk.util.k8s_status:
    api_version: '{{ api_version }}'
    kind: "{{ kind }}"
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    status:
      deployedVersion: "{{ installed_plugins.galaxy }}"
...
