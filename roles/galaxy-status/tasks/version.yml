---
- name: Set the status protocol and port
  ansible.builtin.set_fact:
    status_protocol: "https"
    status_port: "8443"
  when:
    - ingress_type | lower == 'route'
    - route_tls_termination_mechanism | lower == 'passthrough'

- name: Check through galaxy-web
  ansible.builtin.include_tasks: check_status.yml
  vars:
    status_service_host: "{{ ansible_operator_meta.name }}-web-svc.{{ ansible_operator_meta.namespace }}.svc.cluster.local"
    status_url: '{{ status_protocol }}://{{ status_service_host }}:{{ status_port }}/{{ pulp_combined_settings.galaxy_api_path_prefix }}/pulp/api/v3/status/'
    expected_content_apps: "{{ (combined_content.replicas | int) * (gunicorn_content_workers | int) }}"
  when:
    - ingress_type | lower != 'route'

- name: Check through galaxy-route
  ansible.builtin.include_tasks: check_status.yml
  vars:
    status_url: 'https://{{ route_host }}/{{ pulp_combined_settings.galaxy_api_path_prefix }}/pulp/api/v3/status/'
    status_validate_certs: false
    expected_content_apps: "{{ (combined_content.replicas | int) * (gunicorn_content_workers | int) }}"
  when:
    - ingress_type | lower == 'route'

- name: Set application status result
  ansible.builtin.set_fact:
    result: '{{ status_check_result }}'

- name: Get installed plugins
  ansible.builtin.set_fact:
    installed_plugins: "{{ result.json.versions | items2dict(key_name='component', value_name='version') }}"

- name: Show installed plugins
  ansible.builtin.debug:
    var: installed_plugins

- name: Update version status
  operator_sdk.util.k8s_status:
    api_version: '{{ api_version }}'
    kind: "{{ kind }}"
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    status:
      deployedVersion: "{{ installed_plugins.galaxy }}"
