---
- name: Get content Deployment for heartbeat recovery
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-content"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: content_deployment

- name: Require an available content Deployment before restarting Pods
  ansible.builtin.assert:
    that:
      - content_deployment.resources | length > 0
      - content_deployment.resources[0].status.availableReplicas | default(0) | int == content_deployment.resources[0].spec.replicas | int
    fail_msg: "Content Deployment is still starting; delaying heartbeat recovery."

- name: Get content Pods for heartbeat recovery
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ansible_operator_meta.namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ deployment_type }}-content"
      - "app.kubernetes.io/instance={{ deployment_type }}-content-{{ ansible_operator_meta.name }}"
  register: content_pods

- name: Restart content Pods serially after missed heartbeat
  ansible.builtin.include_tasks: restart_content_pod.yml
  loop: "{{ content_pods.resources }}"
  loop_control:
    loop_var: content_pod

- name: Wait for content heartbeats after recovery
  ansible.builtin.uri:
    url: "{{ status_url }}"
    validate_certs: "{{ status_validate_certs | default(true) }}"
  register: recovered_status
  until: >
    recovered_status.json is defined and
    recovered_status.json.versions | length and
    (recovered_status.json.online_content_apps | default([], true) | length) >= (expected_content_apps | int) and
    recovered_status.json.database_connection.connected and
    (recovered_status.json.redis_connection.connected or not pulp_combined_settings.cache_enabled) and
    recovered_status.json.online_workers | map(attribute='name') | select('match', '^[0-9]+@.*$') | list | count > 0
  delay: 5
  retries: 60
