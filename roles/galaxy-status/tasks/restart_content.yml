---
- name: Get content Deployment for heartbeat recovery
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-content"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: content_deployment

- name: Require an available content Deployment before restarting Pods
  ansible.builtin.assert:
    that:
      - content_deployment.resources | length > 0
    fail_msg: "Content Deployment was not found; delaying heartbeat recovery."

- name: Set content recovery state
  ansible.builtin.set_fact:
    content_deployment_resource: "{{ content_deployment.resources[0] }}"
    content_recovery_time: "{{ lookup('pipe', 'date +%s') | int }}"
    content_last_recovery_time: >-
      {{ content_deployment_resource.metadata.annotations['galaxy.ansible.com/content-heartbeat-recovery-at'] | default('0') | int }}

- name: Require an available content Deployment before restarting Pods
  ansible.builtin.assert:
    that:
      - content_deployment_resource.status.availableReplicas | default(0) | int == content_deployment_resource.spec.replicas | int
    fail_msg: "Content Deployment is still starting; delaying heartbeat recovery."

- name: Enforce content recovery cooldown
  ansible.builtin.assert:
    that:
      - content_recovery_time | int - content_last_recovery_time | int >= content_heartbeat_recovery_cooldown_seconds | int
    fail_msg: "Content heartbeat recovery is still in cooldown."

- name: Mark content heartbeat recovery
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-content"
    namespace: "{{ ansible_operator_meta.namespace }}"
    state: present
    merge_type:
      - merge
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ ansible_operator_meta.name }}-content"
        namespace: "{{ ansible_operator_meta.namespace }}"
        annotations:
          galaxy.ansible.com/content-heartbeat-recovery-at: "{{ content_recovery_time }}"

- name: Get content Pods for heartbeat recovery
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ansible_operator_meta.namespace }}"
    label_selectors:
      - "app.kubernetes.io/name={{ deployment_type }}-content"
      - "app.kubernetes.io/instance={{ deployment_type }}-content-{{ ansible_operator_meta.name }}"
  register: content_pods

- name: Restart content Pods serially after missed heartbeat
  ansible.builtin.include_tasks: restart_content_pod.yml
  loop: "{{ content_pods.resources }}"
  loop_control:
    loop_var: content_pod
