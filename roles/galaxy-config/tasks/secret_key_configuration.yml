---
- name: Check for existing secret key secret
  k8s_info:
    kind: Secret
    namespace: '{{ ansible_operator_meta.namespace }}'
    name: '{{ ansible_operator_meta.name }}-secret-key'
  register: _existing_secret_key
  no_log: "{{ no_log }}"

- block:
    - name: Generate and store secret key secret
      k8s:
        apply: true
        definition: "{{ lookup('template', 'galaxy-secret-key.secret.yaml.j2') }}"
      no_log: "{{ no_log }}"

    - name: Remove ownerReferences from secret key secret to avoid garbage collection
      k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: '{{ ansible_operator_meta.name }}-secret-key'
            namespace: '{{ ansible_operator_meta.namespace }}'
            ownerReferences: null
      no_log: "{{ no_log }}"

    - name: Read generated secret key secret
      k8s_info:
        kind: Secret
        namespace: '{{ ansible_operator_meta.namespace }}'
        name: '{{ ansible_operator_meta.name }}-secret-key'
      register: _generated_secret_key
      no_log: "{{ no_log }}"

  when:
    - not _existing_secret_key['resources'] | default([]) | length
    - pulp_combined_settings.secret_key is not defined

- name: Set secret key from generated secret
  set_fact:
    pulp_combined_settings: "{{ pulp_combined_settings | combine({'secret_key': _generated_secret_key['resources'][0]['data']['secret_key'] | b64decode}) }}"
  no_log: "{{ no_log }}"
  when:
    - pulp_combined_settings.secret_key is not defined
    - _generated_secret_key is defined and _generated_secret_key['resources'] | default([]) | length

- name: Set secret key from existing secret
  set_fact:
    pulp_combined_settings: "{{ pulp_combined_settings | combine({'secret_key': _existing_secret_key['resources'][0]['data']['secret_key'] | b64decode}) }}"
  no_log: "{{ no_log }}"
  when:
    - pulp_combined_settings.secret_key is not defined
    - _existing_secret_key['resources'] | default([]) | length
