---
- name: Fail early if a named container token secret is missing or incomplete
  when: (container_token_secret | default('')) | length > 0
  block:
    - name: Look up the named container token secret
      k8s_info:
        kind: Secret
        namespace: '{{ ansible_operator_meta.namespace }}'
        name: '{{ container_token_secret }}'
      register: _named_container_token_secret
      no_log: "{{ no_log }}"

    - name: Record that the named container token secret is absent
      ansible.builtin.set_fact:
        _container_token_keys_ok: false
      when: _named_container_token_secret.resources | default([]) | length == 0

    - name: Record whether the named container token secret has a usable key pair
      vars:
        _token_data: "{{ _named_container_token_secret.resources[0].data | default({}, true) }}"
      ansible.builtin.set_fact:
        _container_token_keys_ok: >-
          {{
            (
              (_token_data['container_auth_public_key.pem'] is defined)
              and (_token_data['container_auth_public_key.pem'] | length > 0)
              and (_token_data['container_auth_private_key.pem'] is defined)
              and (_token_data['container_auth_private_key.pem'] | length > 0)
            ) or (
              (_token_data['tls.crt'] is defined)
              and (_token_data['tls.crt'] | length > 0)
              and (_token_data['tls.key'] is defined)
              and (_token_data['tls.key'] | length > 0)
            )
          }}
      no_log: "{{ no_log }}"
      when: _named_container_token_secret.resources | default([]) | length > 0

    - name: Record the container token secret failure on the CR
      k8s_status:
        api_version: "{{ api_version }}"
        kind: "{{ kind }}"
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        conditions:
          - type: "{{ deployment_type|capitalize }}-API-Ready"
            status: "False"
            reason: ContainerTokenSecretNotReady
            message: >-
              Secret '{{ container_token_secret }}' must already exist in
              namespace '{{ ansible_operator_meta.namespace }}' and contain
              container_auth_public_key.pem and container_auth_private_key.pem,
              or tls.crt and tls.key. For VSO, create that secret in Vault
              and sync it before relying on this field. The operator will
              not generate keys for a named secret.
            lastTransitionTime: "{{ lookup('pipe', 'date --iso-8601=seconds') }}"
      when: not _container_token_keys_ok | bool

    - name: Fail if the named container token secret is not ready
      ansible.builtin.fail:
        msg: >-
          Secret '{{ container_token_secret }}' must already exist in
          namespace '{{ ansible_operator_meta.namespace }}' and contain
          container_auth_public_key.pem and container_auth_private_key.pem,
          or tls.crt and tls.key. For VSO, create that secret in Vault
          and sync it before relying on this field. The operator will
          not generate keys for a named secret.
      when: not _container_token_keys_ok | bool
