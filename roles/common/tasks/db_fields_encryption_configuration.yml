---
- k8s_status:
    api_version: "{{ api_version }}"
    kind: "{{ kind }}"
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    conditions:
      - type: "{{ deployment_type|capitalize }}-API-Ready"
        message: Configuring DB fields encryption Secret name
        reason: ConfiguringDBFieldsEncryption
        status: "False"
        lastTransitionTime: "{{ lookup('pipe', 'date --iso-8601=seconds') }}"

- name: Record whether a DB fields encryption secret name was explicitly provided
  set_fact:
    _db_fields_encryption_secret_provided: '{{ (db_fields_encryption_secret | default("")) | length > 0 }}'

- name: Set default DB fields encryption secret name
  set_fact:
    db_fields_encryption_secret: '{{ ansible_operator_meta.name }}-db-fields-encryption'
    cacheable: yes
  when: not db_fields_encryption_secret | default('')

- name: Check for specified DB fields encryption configuration
  k8s_info:
    kind: Secret
    namespace: '{{ ansible_operator_meta.namespace }}'
    name: '{{ db_fields_encryption_secret }}'
  register: _db_fields_encryption_secret
  no_log: "{{ no_log }}"

- name: Fail early if a named DB fields encryption secret is missing or has no key
  when: _db_fields_encryption_secret_provided | bool
  block:
    - name: Record that the named DB fields encryption secret is absent
      ansible.builtin.set_fact:
        _db_fields_encryption_secret_ready: false
      when: _db_fields_encryption_secret.resources | default([]) | length == 0

    - name: Record whether the named DB fields encryption secret contains a key
      ansible.builtin.set_fact:
        _db_fields_encryption_secret_ready: >-
          {{
            (
              _db_fields_encryption_secret.resources[0].data is defined
            ) and (
              _db_fields_encryption_secret.resources[0].data['database_fields.symmetric.key'] is defined
            ) and (
              _db_fields_encryption_secret.resources[0].data['database_fields.symmetric.key'] | length > 0
            )
          }}
      no_log: "{{ no_log }}"
      when: _db_fields_encryption_secret.resources | default([]) | length > 0

    - name: Record the DB fields encryption secret failure on the CR
      k8s_status:
        api_version: "{{ api_version }}"
        kind: "{{ kind }}"
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        conditions:
          - type: "{{ deployment_type|capitalize }}-API-Ready"
            status: "False"
            reason: DBFieldsEncryptionSecretNotReady
            message: >-
              Secret '{{ db_fields_encryption_secret }}' must already exist in
              namespace '{{ ansible_operator_meta.namespace }}' and contain a
              non-empty database_fields.symmetric.key. For VSO, create that
              secret in Vault and sync it before relying on this field. The
              operator will not generate a key for a named secret.
            lastTransitionTime: "{{ lookup('pipe', 'date --iso-8601=seconds') }}"
      when: not _db_fields_encryption_secret_ready | bool

    - name: Fail if the named DB fields encryption secret is not ready
      ansible.builtin.fail:
        msg: >-
          Secret '{{ db_fields_encryption_secret }}' must already exist in
          namespace '{{ ansible_operator_meta.namespace }}' and contain a
          non-empty database_fields.symmetric.key. For VSO, create that
          secret in Vault and sync it before relying on this field. The
          operator will not generate a key for a named secret.
      when: not _db_fields_encryption_secret_ready | bool

- block:
    - k8s_status:
        api_version: "{{ api_version }}"
        kind: "{{ kind }}"
        name: "{{ ansible_operator_meta.name }}"
        namespace: "{{ ansible_operator_meta.namespace }}"
        conditions:
          - type: "{{ deployment_type|capitalize }}-API-Ready"
            message: Creating DB fields encryption Secret
            reason: CreatingDBSecret
            status: "False"
            lastTransitionTime: "{{ lookup('pipe', 'date --iso-8601=seconds') }}"

    - name: Generate Galaxy Database Encryption Key
      shell: |
        from cryptography.fernet import Fernet
        with open("/tmp/fernet", "wb") as key_file:
            key_file.write(Fernet.generate_key())
      args:
        executable: /usr/local/bin/python3
      no_log: "{{ no_log }}"

    - name: Store DB fields encryption key
      set_fact:
        db_fields_encryption_key: "{{ lookup('file', '/tmp/fernet') }}"
      no_log: "{{ no_log }}"

    - name: Create DB fields encryption secret
      k8s:
        apply: true
        definition: "{{ lookup('template', 'galaxy-db-fields-encryption.secret.yaml.j2') }}"
      no_log: "{{ no_log }}"

    - name: Remove ownerReferences from DB fields encryption secret to avoid garbage collection
      k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: '{{ ansible_operator_meta.name }}-db-fields-encryption'
            namespace: '{{ ansible_operator_meta.namespace }}'
            ownerReferences: null
      no_log: "{{ no_log }}"

  when:
    - not _db_fields_encryption_secret_provided | bool
    - not _db_fields_encryption_secret['resources'] | default([]) | length

- name: Retrieve db_fields_encryption_key Secret
  k8s_info:
    kind: Secret
    namespace: '{{ ansible_operator_meta.namespace }}'
    name: '{{ db_fields_encryption_secret }}'
  register: db_fields_encryption_secret_contents
  no_log: "{{ no_log }}"
