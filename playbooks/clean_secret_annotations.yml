---
# AAP-93431: strip cleartext credentials leaked into the
# kubectl.kubernetes.io/last-applied-configuration annotation.
#
# Operator versions before this one created these Secrets with client-side
# apply, which mirrors `kubectl apply` and persists the full submitted
# manifest - stringData included - in that annotation. Read access to Secret
# *metadata* was therefore enough to recover hub credentials and keys.
#
# Secrets written by this version use server-side apply and never produce the
# annotation, so this only remediates deployments upgraded from an affected
# version. It is a no-op once every operator-managed Secret is clean.
#
# This must run unconditionally, outside the role task files: every
# Secret-creation block in this operator is guarded by
# `when: not <secret>['resources'] | length`, so on an upgrade - the only case
# where a leaked annotation can exist - those blocks are skipped entirely and
# could never clean up after themselves.
#
# Only the operator's own generated Secret names are listed. User-supplied
# Secrets (admin_password_secret, postgres_configuration_secret, ...) are never
# written by the operator with apply, so they cannot carry an annotation we
# wrote, and stripping one the user manages themselves is not ours to do.

- name: Define operator-managed Secret names that may carry a leaked annotation
  ansible.builtin.set_fact:
    _leaked_annotation_secrets:
      - '{{ ansible_operator_meta.name }}-admin-password'
      - '{{ ansible_operator_meta.name }}-postgres-configuration'
      - '{{ ansible_operator_meta.name }}-db-fields-encryption'
      - '{{ ansible_operator_meta.name }}-secret-key'
      - '{{ ansible_operator_meta.name }}-container-auth'

- name: Look up operator-managed Secrets
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ ansible_operator_meta.namespace }}'
    name: '{{ item }}'
  loop: '{{ _leaked_annotation_secrets }}'
  register: _leaked_annotation_lookup
  no_log: "{{ no_log }}"

- name: Remove kubectl.kubernetes.io/last-applied-configuration annotation
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ item.item }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
        annotations:
          kubectl.kubernetes.io/last-applied-configuration: null
  loop: '{{ _leaked_annotation_lookup.results }}'
  when:
    - item.resources | default([]) | length
    # yamllint disable-line rule:line-length
    - "'kubectl.kubernetes.io/last-applied-configuration' in (item.resources[0].metadata.annotations | default({}))"
  no_log: "{{ no_log }}"
