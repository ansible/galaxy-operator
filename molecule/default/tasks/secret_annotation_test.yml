---
# AAP-93431 regression guard.
#
# Operator versions before this one created Secrets with client-side apply,
# which persists the full submitted manifest - stringData included - in the
# kubectl.kubernetes.io/last-applied-configuration annotation, so read access
# to Secret metadata was enough to recover Galaxy credentials and keys.
#
# Two things are checked, and the second is the one that matters:
#
#   1. No operator-managed Secret carries the annotation after a normal
#      install. This alone is a weak check - server-side apply means the
#      annotation is never written on a fresh deployment, so it would pass
#      even if the cleanup task were a no-op.
#
#   2. An annotation planted on an existing Secret is actually stripped on the
#      next reconcile. This exercises the upgrade path, which is the only case
#      where a leaked annotation can exist, and is what catches a cleanup task
#      that is silently ineffective (wrong nesting under metadata, a guard that
#      never fires, a task file that is never included).

- name: Set Galaxy resource name from sample CR
  ansible.builtin.set_fact:
    galaxy_cr_name: "{{ sample_cr | from_yaml | json_query('metadata.name') }}"
  vars:
    cr_file: 'galaxy_v1beta1_galaxy_cr.molecule.ci.yaml'
    sample_cr: "{{ lookup('template', '/'.join([samples_dir, cr_file])) }}"

- name: Define the Secret names this operator generates
  ansible.builtin.set_fact:
    managed_secret_names:
      - '{{ galaxy_cr_name }}-admin-password'
      - '{{ galaxy_cr_name }}-postgres-configuration'
      - '{{ galaxy_cr_name }}-db-fields-encryption'
      - '{{ galaxy_cr_name }}-secret-key'
      - '{{ galaxy_cr_name }}-container-auth'
    leaked_annotation: kubectl.kubernetes.io/last-applied-configuration

- name: Fetch operator-managed Secrets
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ namespace }}'
    name: '{{ item }}'
  loop: '{{ managed_secret_names }}'
  register: managed_secrets

- name: Assert at least one operator-managed Secret was found
  ansible.builtin.assert:
    that:
      - managed_secrets.results | selectattr('resources') | list | length > 0
    fail_msg: >-
      None of the expected operator-managed Secrets exist
      ({{ managed_secret_names | join(', ') }}); the annotation checks below
      would pass vacuously.

- name: Assert no operator-managed Secret carries a last-applied-configuration annotation
  ansible.builtin.assert:
    that:
      - leaked_annotation not in (item.resources[0].metadata.annotations | default({}))
    fail_msg: >-
      Secret '{{ item.item }}' carries {{ leaked_annotation }}, which stores the
      submitted manifest - including cleartext stringData - in Secret metadata.
      Secret creation must use server_side_apply.
  loop: "{{ managed_secrets.results | selectattr('resources') | list }}"
  loop_control:
    label: '{{ item.item }}'

# --- Check 2: the cleanup path actually removes a pre-existing annotation ---

- name: Select an existing Secret to plant a leaked annotation on
  ansible.builtin.set_fact:
    planted_secret: "{{ (managed_secrets.results | selectattr('resources') | list | first).item }}"

- name: Record the Secret data before remediation
  ansible.builtin.set_fact:
    planted_secret_data_before: "{{ (managed_secrets.results | selectattr('resources') | list | first).resources[0].data }}"

- name: Plant a last-applied-configuration annotation, simulating an upgraded deployment
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ planted_secret }}'
        namespace: '{{ namespace }}'
        annotations:
          # Shape matches what client-side apply wrote; the value is a
          # placeholder and holds no real credential.
          kubectl.kubernetes.io/last-applied-configuration: >-
            {"apiVersion":"v1","kind":"Secret",
            "metadata":{"name":"{{ planted_secret }}",
            "namespace":"{{ namespace }}"},
            "stringData":{"planted":"aap-93431-regression-probe"}}

- name: Confirm the planted annotation is present before reconciling
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ namespace }}'
    name: '{{ planted_secret }}'
  register: planted_check
  failed_when: leaked_annotation not in (planted_check.resources[0].metadata.annotations | default({}))

- name: Trigger a reconcile by touching an annotation on the Galaxy CR
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: galaxy.ansible.com/v1beta1
      kind: Galaxy
      metadata:
        name: '{{ galaxy_cr_name }}'
        namespace: '{{ namespace }}'
        annotations:
          # Unrelated to aap.ansible.io/client-request-timeout, the only
          # annotation the operator reads, so this changes no behaviour.
          molecule.test/aap-93431-probe: '{{ ansible_date_time.iso8601 | default(99999 | random | string) }}'

- name: Wait up to 5m for the operator to strip the planted annotation
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ namespace }}'
    name: '{{ planted_secret }}'
  register: remediated
  until:
    - remediated.resources | length > 0
    - leaked_annotation not in (remediated.resources[0].metadata.annotations | default({}))
  delay: 5
  retries: 60
  failed_when: false

- name: Assert the operator removed the planted annotation
  ansible.builtin.assert:
    that:
      - leaked_annotation not in (remediated.resources[0].metadata.annotations | default({}))
    fail_msg: >-
      The operator did not strip {{ leaked_annotation }} from Secret
      '{{ planted_secret }}' within 5m. The cleanup task ran without effect or
      never ran at all - check that clean_secret_annotations.yml is included
      from playbooks/galaxy.yaml and that the annotation is nested under
      metadata.annotations.

- name: Assert remediation did not alter the Secret contents
  ansible.builtin.assert:
    that:
      - remediated.resources[0].data == planted_secret_data_before
    fail_msg: >-
      Secret '{{ planted_secret }}' data changed while removing the annotation.
      The cleanup must only strip metadata, never rewrite Secret values.
