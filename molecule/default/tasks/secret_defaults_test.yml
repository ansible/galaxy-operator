---
- name: Set Galaxy CR name from the pre_secrets molecule CI sample
  ansible.builtin.set_fact:
    _galaxy_cr_name: >-
      {{ lookup('template', '/'.join([samples_dir, cr_file]))
         | from_yaml | json_query('metadata.name') }}
  vars:
    cr_file: 'galaxy_v1beta1_galaxy_cr.pre_secrets.ci.yaml'

- name: Compute the default names produced when the guards fire
  ansible.builtin.set_fact:
    _expected_db_default_name: "{{ _galaxy_cr_name }}-db-fields-encryption"
    _expected_container_default_name: "{{ _galaxy_cr_name }}-container-auth"

- name: Create pre-existing DB fields encryption secret
  k8s:
    state: present
    namespace: '{{ namespace }}'
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: custom-db-fields-encryption
      type: Opaque
      stringData:
        database_fields.symmetric.key: "VEdETHRsWjJoM1VmUWlvSjdSOC0yOVlmbVBLZFJxUE9HTXM5cjdNMG5Ubz0="

- name: Read the pre-created DB fields encryption key
  k8s_info:
    kind: Secret
    namespace: '{{ namespace }}'
    name: custom-db-fields-encryption
  register: _pre_db_fields_secret_before

- name: Remember the original DB fields encryption key
  ansible.builtin.set_fact:
    _original_db_fields_key: >-
      {{ _pre_db_fields_secret_before.resources[0].data['database_fields.symmetric.key'] }}

- name: Create the Galaxy CR referencing a pre-existing DB fields secret
  k8s:
    state: present
    namespace: '{{ namespace }}'
    definition: "{{ lookup('template', '/'.join([samples_dir, cr_file])) | from_yaml }}"
  vars:
    cr_file: 'galaxy_v1beta1_galaxy_cr.pre_secrets.ci.yaml'

- name: Wait for operator to finish execution
  k8s_info:
    api_version: '{{ custom_resource.apiVersion }}'
    kind: '{{ custom_resource.kind }}'
    namespace: '{{ namespace }}'
    name: '{{ custom_resource.metadata.name }}'
  register: cr
  until:
    - "'OperatorFinishedExecution' in (cr | json_query('resources[].status.conditions[].reason'))"
  delay: 6
  retries: 100
  vars:
    cr_file: 'galaxy_v1beta1_galaxy_cr.pre_secrets.ci.yaml'
    custom_resource: "{{ lookup('template', '/'.join([samples_dir, cr_file])) | from_yaml }}"

- name: Retrieve the pre-existing DB fields encryption secret
  k8s_info:
    kind: Secret
    namespace: '{{ namespace }}'
    name: custom-db-fields-encryption
  register: _pre_db_fields_secret

- name: Assert the pre-existing DB fields encryption secret is present and intact
  ansible.builtin.assert:
    that:
      - >-
        (_pre_db_fields_secret.resources | length == 1) and
        ((_pre_db_fields_secret.resources | first).data['database_fields.symmetric.key']
        | default('') == _original_db_fields_key)
    fail_msg: The pre-existing DB fields encryption key was replaced or removed.

- name: Check the default-named DB fields encryption secret was NOT auto-generated
  k8s_info:
    kind: Secret
    namespace: '{{ namespace }}'
    name: '{{ _expected_db_default_name }}'
  register: _default_db_fields_secret

- name: Assert the operator did NOT auto-generate the default DB fields secret
  ansible.builtin.assert:
    that:
      - _default_db_fields_secret.resources | length == 0
    fail_msg: >-
      Operator auto-generated {{ _expected_db_default_name }} even though the CR
      set db_fields_encryption_secret to a pre-existing secret:
      {{ _default_db_fields_secret.resources }}

- name: Wait for the auto-generated container auth secret
  k8s_info:
    kind: Secret
    namespace: '{{ namespace }}'
    name: '{{ _expected_container_default_name }}'
  register: _auto_container_auth_secret
  until: _auto_container_auth_secret.resources | length > 0
  retries: 30
  delay: 10

- name: Assert the auto-generated container auth secret has the expected keys
  ansible.builtin.assert:
    that:
      - _auto_container_auth_secret.resources | length == 1
      - "'container_auth_private_key.pem' in _auto_container_auth_secret.resources[0].data"
      - "'container_auth_public_key.pem' in _auto_container_auth_secret.resources[0].data"
    fail_msg: >-
      Auto-generated container auth secret is missing or does not contain the
      expected keys: {{ _auto_container_auth_secret.resources }}

- name: Get the Galaxy CR status
  k8s_info:
    api_version: galaxy.ansible.com/v1beta1
    kind: Galaxy
    namespace: '{{ namespace }}'
    name: '{{ _galaxy_cr_name }}'
  register: _galaxy_cr_status

- name: Assert CR status reports the pre-existing DB fields secret name
  ansible.builtin.assert:
    that:
      - >-
        (_galaxy_cr_status.resources | length > 0) and
        ((_galaxy_cr_status.resources | first).status.dbFieldsEncryptionSecret | default('')
        == 'custom-db-fields-encryption')
    fail_msg: CR status.dbFieldsEncryptionSecret was not 'custom-db-fields-encryption'.

- name: Assert CR status reports the auto-generated container token secret name
  ansible.builtin.assert:
    that:
      - >-
        (_galaxy_cr_status.resources | length > 0) and
        ((_galaxy_cr_status.resources | first).status.containerTokenSecret | default('')
        == _expected_container_default_name)
    fail_msg: >-
      CR status.containerTokenSecret was not '{{ _expected_container_default_name }}'.

- name: Get the galaxy-api deployment
  k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ namespace }}'
    name: '{{ _galaxy_cr_name }}-api'
  register: _api_deployment

- name: Assert the API deployment mounts the pre-existing DB fields secret
  ansible.builtin.assert:
    that:
      - >-
        (_api_deployment.resources | length > 0) and
        ('custom-db-fields-encryption' in
        ((_api_deployment.resources | first).spec.template.spec.volumes | default([])
        | map(attribute='secret', default={})
        | map(attribute='secretName', default='')
        | list))
    fail_msg: API deployment does not mount the pre-existing DB fields secret.

- name: Verify a missing named secret fails without generating a key
  block:
    - name: Set the missing-secret CR name
      ansible.builtin.set_fact:
        _missing_secret_cr_name: example-galaxy-missing-secret
        _missing_db_fields_secret_name: missing-db-fields-encryption

    - name: Create a Galaxy CR whose DB fields secret does not exist
      k8s:
        state: present
        namespace: '{{ namespace }}'
        definition:
          apiVersion: galaxy.ansible.com/v1beta1
          kind: Galaxy
          metadata:
            name: '{{ _missing_secret_cr_name }}'
          spec:
            db_fields_encryption_secret: '{{ _missing_db_fields_secret_name }}'
            storage_type: File
            ingress_type: nodeport
            file_storage_access_mode: ReadWriteMany
            file_storage_size: 10Gi

    - name: Wait until the CR reports the named secret is not ready
      k8s_info:
        api_version: galaxy.ansible.com/v1beta1
        kind: Galaxy
        namespace: '{{ namespace }}'
        name: '{{ _missing_secret_cr_name }}'
      register: _missing_secret_cr
      until:
        - >-
          'DBFieldsEncryptionSecretNotReady' in
          (_missing_secret_cr | json_query('resources[].status.conditions[].reason'))
      delay: 6
      retries: 40

    - name: Check the named DB fields secret was not created
      k8s_info:
        kind: Secret
        namespace: '{{ namespace }}'
        name: '{{ _missing_db_fields_secret_name }}'
      register: _missing_named_secret

    - name: Check the default DB fields secret was not auto-generated
      k8s_info:
        kind: Secret
        namespace: '{{ namespace }}'
        name: '{{ _missing_secret_cr_name }}-db-fields-encryption'
      register: _missing_default_secret

    - name: Assert the operator did not generate a key for the missing secret
      ansible.builtin.assert:
        that:
          - _missing_named_secret.resources | length == 0
          - _missing_default_secret.resources | length == 0
        fail_msg: >-
          Operator created a DB fields encryption secret for
          {{ _missing_secret_cr_name }} even though the named secret was absent.
  always:
    - name: Delete the Galaxy CR that referenced a missing secret
      k8s:
        state: absent
        api_version: galaxy.ansible.com/v1beta1
        kind: Galaxy
        namespace: '{{ namespace }}'
        name: example-galaxy-missing-secret
